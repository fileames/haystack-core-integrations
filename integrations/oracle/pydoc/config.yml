loaders:
  - type: haystack_pydoc_tools.loaders.CustomPythonLoader
    search_path: [../src]
    modules: [
      "haystack_integrations.components.retrievers.oracle.embedding_retriever",
      "haystack_integrations.components.document_stores.oracle.document_store",
      "haystack_integrations.components.embedders.oracle.document_embedder",
      "haystack_integrations.components.embedders.oracle.text_embedder",
    ]
    ignore_when_discovered: ["__init__"]
processors:
  - type: filter
    expression:
    documented_only: true
    do_not_filter_modules: false
    skip_empty_modules: true
  - type: smart
  - type: crossref
renderer:
  type: haystack_pydoc_tools.renderers.ReadmeIntegrationRenderer
  excerpt: Oracle AI Vector Search integration for Haystack
  category_slug: integrations-api
  title: Oracle AI Vector Search
  slug: integrations-oracle
  order: 190
  markdown:
    descriptive_class_title: false
    classdef_code_block: false
    descriptive_module_title: true
    add_method_class_prefix: true
    add_member_class_prefix: false
    filename: _readme_oracle.md
